var view="today";try{view=localStorage.getItem(LSV)||"today";}catch(e){}
var newColor=COLORS[0],menuOpen=false,poolOpen=true,pickOpen=false,popId=null;

function pad(n){return(n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseYmd(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function daysUntil(s){return Math.round((parseYmd(s)-today0())/864e5);}
function monday(){var d=today0();d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function dayDate(i){var d=monday();d.setDate(d.getDate()+i);return d;}
function fmt(d){return pad(d.getDate())+"."+pad(d.getMonth()+1)+".";}
function fmtDay(s){var d=parseYmd(s);return DAYS[(d.getDay()+6)%7][1]+" "+fmt(d);}
function todayIdx(){return(new Date().getDay()+6)%7;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function uid(p){return p+(state.next++);}

function ensure(){
state.lists=state.lists||{};if(!state.lists.pool)state.lists.pool=[];state.limits=state.limits||{work:4,uni:4};state.next=state.next||1;state.tasks=state.tasks||{};
DAYS.forEach(function(d){["work","uni"].forEach(function(t){var k=d[0]+"-"+t;if(!state.lists[k])state.lists[k]=[];});});
for(var id in state.tasks){var t=state.tasks[id];if(t.done===undefined)t.done=false;if(!t.subs)t.subs=[];}
state.recurring=state.recurring||[];state.rdone=state.rdone||{};state.dayLog=state.dayLog||{};state.history=state.history||[];
state.focusMin=state.focusMin||90;state.tracking=state.tracking||null;for(var tid in state.tasks){if(!state.tasks[tid].spent)state.tasks[tid].spent=0;}state.breakMin=state.breakMin||30;
if(!state.subjects)state.subjects=JSON.parse(JSON.stringify(SEED_SUBJECTS));
if(!state.weekOf)state.weekOf=ymd(monday());
var cut=new Date();cut.setDate(cut.getDate()-70);var ck=ymd(cut);
for(var k in state.rdone){if(k.slice(0,10)<ck)delete state.rdone[k];}
}
ensure();
function findList(id){for(var k in state.lists){if(state.lists[k].indexOf(id)>-1)return k;}return null;}
function where(k){if(!k||k==="pool")return"Not scheduled";var p=k.split("-");var d=DAYS.filter(function(x){return x[0]===p[0];})[0];return d[1]+" · "+(p[1]==="work"?"Work":"Uni");}
function hrs(n){n=Math.round(n*100)/100;return(n%1===0?n:n.toFixed(n*4%1===0&&n*2%1!==0?2:1))+" h";}
function laneHours(k){return state.lists[k].reduce(function(s,id){var t=state.tasks[id];return s+(t&&t.est?+t.est:0);},0);}
function dayItems(i){var d=DAYS[i][0];var key=ymd(dayDate(i));
var ids=state.lists[d+"-work"].concat(state.lists[d+"-uni"]).filter(function(id){return state.tasks[id];});
var rec=state.recurring.filter(function(r){return r.days.indexOf(i)>-1;});
var total=ids.length+rec.length,done=ids.filter(function(id){return state.tasks[id].done;}).length+rec.filter(function(r){return state.rdone[key+"|"+r.id];}).length;
return{ids:ids,rec:rec,key:key,total:total,done:done};}
function stats(){var total=0,done=0;for(var id in state.tasks){total++;if(state.tasks[id].done)done++;}
var pool=state.lists.pool.filter(function(id){return state.tasks[id]&&!state.tasks[id].done;}).length,openSched=0;
for(var k in state.lists){if(k==="pool")continue;state.lists[k].forEach(function(id){if(state.tasks[id]&&!state.tasks[id].done)openSched++;});}
return{total:total,done:done,pool:pool,openSched:openSched};}
function updateLog(){var ti=todayIdx();for(var i=0;i<=ti;i++){var x=dayItems(i);if(x.total)state.dayLog[x.key]={t:x.total,d:x.done};}}
function streak(){var d=today0(),n=0,l=state.dayLog[ymd(d)];if(!(l&&l.t>0&&l.d>=l.t))d.setDate(d.getDate()-1);
for(var g=0;g<500;g++){var l2=state.dayLog[ymd(d)];if(l2&&l2.t>0&&l2.d>=l2.t){n++;d.setDate(d.getDate()-1);}else break;}return n;}
function clock(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+pad(m):m)+":"+pad(s%60);}
function fmtDur(ms){var m=Math.floor(ms/60000),h=Math.floor(m/60);m=m%60;return h?h+"h "+pad(m)+"m":m+"m";}
function spentOf(id){var t=state.tasks[id];if(!t)return 0;var x=t.spent||0;if(state.tracking&&state.tracking.tid===id)x+=Date.now()-state.tracking.start;return x;}
function stopTracking(){var T=state.tracking;if(!T)return;var t=state.tasks[T.tid];if(t)t.spent=(t.spent||0)+(Date.now()-T.start);state.tracking=null;}
function toggleTracking(id){var was=state.tracking&&state.tracking.tid===id;stopTracking();if(!was){state.tracking={tid:id,start:Date.now()};playTick();toast("Timer started");}else{toast("Tracked: "+fmtDur(state.tasks[id].spent));}save();renderPill();}
function examList(){return state.subjects.filter(function(s){return s.exam&&daysUntil(s.exam)>=0;}).sort(function(a,b){return a.exam<b.exam?-1:1;});}

// ---------- rendering ----------
function badges(t,id){var b=[];
if(t.due){var n=daysUntil(t.due),cls=n<=0?"red":(n<=2?"orange":"");b.push('<span class="b '+cls+'">'+(n<0?"Overdue · ":(n===0?"Today · ":""))+fmtDay(t.due)+"</span>");}
if(t.est)b.push('<span class="b">'+hrs(+t.est)+"</span>");
var sp=spentOf(id),on=state.tracking&&state.tracking.tid===id;if(sp>=60000||on)b.push('<span class="b track" data-spent="'+id+'">⏱ '+fmtDur(sp)+'</span>');
if(t.subs&&t.subs.length){var d=t.subs.filter(function(x){return x.done;}).length;b.push('<span class="b">'+d+"/"+t.subs.length+"</span>");}
return b.length?'<div class="badges">'+b.join("")+"</div>":"";}
function cardHTML(id){var t=state.tasks[id];if(!t)return"";
return'<div class="card'+(t.done?" done":"")+(id===popId?" pop":"")+'" data-id="'+id+'" style="--c:'+esc(t.color)+'"><button class="check" data-check="'+id+'" aria-label="Mark done">'+CHECK+'</button><div class="body"><span class="name">'+esc(t.name)+"</span>"+badges(t,id)+'</div><span class="grip" aria-hidden="true">'+GRIP+"</span></div>";}
function laneHTML(key){var ids=state.lists[key];return'<div class="lane" data-list="'+key+'">'+(ids.length?ids.map(cardHTML).join(""):'<div class="empty">Drop tasks here</div>')+"</div>";}
function swatchHTML(sel,attr){return COLORS.map(function(c){return'<button type="button" class="sw'+(c===sel?" on":"")+'" '+attr+'="'+c+'" style="--c:'+c+'" aria-label="Color"></button>';}).join("");}

function headerHTML(){
var s=stats(),m=monday(),e=dayDate(6);
var range=m.getDate()+(m.getMonth()!==e.getMonth()?" "+MONTHS[m.getMonth()]:"")+" to "+e.getDate()+" "+MONTHS[e.getMonth()];
var pd=s.total?s.done/s.total*100:0,ps=s.total?s.openSched/s.total*100:0;
var tabs=[["today","Today"],["board","Board"],["overview","Overview"],["uni","Uni"]];
var h='<header><div class="top"><h1>Week Planner</h1><span class="range">'+range+'</span><span class="spacer"></span><div class="seg">'+tabs.map(function(t){return'<button data-view="'+t[0]+'" class="'+(view===t[0]?"on":"")+'">'+t[1]+"</button>";}).join("")+'</div><div class="menuwrap"><button class="plain" id="menubtn" aria-label="More">•••</button>'+(menuOpen?menuHTML():"")+"</div></div>";
h+='<div class="progress"><div class="bar"><i class="d" style="width:'+pd+'%"></i><i class="s" style="width:'+ps+'%"></i></div><div class="chips"><span><i class="k" style="background:var(--good)"></i>Done <b>'+s.done+'</b></span><span><i class="k" style="background:var(--accent);opacity:.55"></i>Scheduled <b>'+s.openSched+'</b></span><span><i class="k" style="background:var(--line)"></i>Not scheduled <b>'+s.pool+"</b></span><span>Total <b>"+s.total+"</b></span>"+(syncCfg().token?'<span id="syncst" data-act="sync" style="cursor:pointer">'+syncLabel()+"</span>":"")+"</div></div>";
var st=streak(),ex=examList();
h+='<div class="exams">'+(st?'<span class="ex streak">Streak <b>'+st+" day"+(st===1?"":"s")+"</b></span>":"")+ex.map(function(x){var n=daysUntil(x.exam);return'<span class="ex '+(n<=14?"red":n<=30?"orange":"")+'">'+esc(x.name)+" <b>"+(n===0?"today":n+" d")+"</b></span>";}).join("")+"</div></header>";
if(state.weekOf!==ymd(monday()))h+='<div class="banner">A new week has started. Clear the old one to start fresh. <button class="small primary" data-act="newweek">Start new week</button></div>';
return h;}
function menuHTML(){var o=function(k,v,cur){return"<option"+(cur==v?" selected":"")+">"+v+"</option>";};
return'<div class="menu"><label>Work max per day <select data-limit="work">'+o(0,3,state.limits.work)+o(0,4,state.limits.work)+'</select></label><label>Uni max per day <select data-limit="uni">'+o(0,3,state.limits.uni)+o(0,4,state.limits.uni)+'</select></label><label>Focus minutes <select data-set="focusMin">'+[25,45,60,90,120].map(function(v){return o(0,v,state.focusMin);}).join("")+'</select></label><label>Break minutes <select data-set="breakMin">'+[5,10,15,20,30].map(function(v){return o(0,v,state.breakMin);}).join("")+'</select></label><label>Sounds <input type="checkbox" data-sound'+(state.sound!==false?" checked":"")+'></label><div class="sep"></div><button data-act="sync">Sync between devices…</button><button data-act="recurring">Recurring tasks…</button><button data-act="bulk">Add many tasks…</button><button data-act="newweek">Start new week…</button><div class="sep"></div><button data-act="export">Export backup</button><button data-act="import">Import backup</button></div>';}

function routineStrip(i){var x=dayItems(i);if(!x.rec.length)return"";
return'<div class="rstrip">'+x.rec.map(function(r){var on=state.rdone[x.key+"|"+r.id];return'<button class="rchip'+(on?" done":"")+'" data-rdone="'+x.key+"|"+r.id+'" style="--c:'+esc(r.color)+'"><i></i>'+esc(r.name)+"</button>";}).join("")+"</div>";}

function boardHTML(){
var h='<div class="layout"><section class="panel pool"><div class="ph"><h2>Not scheduled <span class="count">'+state.lists.pool.length+'</span></h2><button class="plain collapse" id="collapse">'+(poolOpen?"Hide":"Show")+"</button></div>";
if(poolOpen)h+='<form class="add" id="addform"><div class="row"><input type="text" id="newname" placeholder="Add a task" autocomplete="off"><button class="primary" type="submit">Add</button></div><div class="swatches">'+swatchHTML(newColor,"data-newcolor")+"</div></form>"+laneHTML("pool");
h+='</section><section class="week">';var ti=todayIdx();
DAYS.forEach(function(d,i){var x=dayItems(i),hw=laneHours(d[0]+"-work"),hu=laneHours(d[0]+"-uni");
h+='<div class="day'+(i===ti?" today":"")+'"><div class="dh"><h3>'+d[1]+'<span class="date">'+fmt(dayDate(i))+'</span></h3><span class="dp">'+(x.total?x.done+"/"+x.total+" done":"")+(hw+hu?"<br>"+hrs(hw+hu):"")+"</span></div>"+routineStrip(i);
["work","uni"].forEach(function(t){var k=d[0]+"-"+t,n=state.lists[k].length,m=state.limits[t],hh=laneHours(k);
h+='<div><div class="lanehead"><span>'+(t==="work"?"Work":"Uni")+'</span><span class="n'+(n>=m?" full":"")+'"><b>'+n+"</b> / "+m+(hh?" · "+hrs(hh):"")+"</span></div>"+laneHTML(k)+"</div>";});
h+="</div>";});
return h+"</section></div>";}

function tcardHTML(id){var t=state.tasks[id];
var subs=t.subs&&t.subs.length?'<div class="subs">'+t.subs.map(function(s,i){return'<div class="sub'+(s.done?" done":"")+'" style="--c:'+esc(t.color)+'"><button class="check" data-sub="'+id+"|"+i+'" aria-label="Subtask">'+CHECK+"</button><span>"+esc(s.t)+"</span></div>";}).join("")+"</div>":"";
return'<div class="tcard'+(t.done?" done":"")+(id===popId?" pop":"")+'" style="--c:'+esc(t.color)+'"><div class="trow'+(t.done?" done":"")+'"><button class="check" data-check="'+id+'" aria-label="Mark done">'+CHECK+'</button><div class="body"><span class="name" data-edit="'+id+'">'+esc(t.name)+"</span>"+badges(t,id)+'</div><button class="trackbtn'+(state.tracking&&state.tracking.tid===id?' on':'')+'" data-track="'+id+'">'+(state.tracking&&state.tracking.tid===id?'■ Stop':'⏱ Start')+'</button><button class="focusbtn" data-focus="'+id+'" aria-label="Start focus timer">'+PLAY+"</button></div>"+subs+"</div>";}

function todayHTML(){
var i=todayIdx(),d=DAYS[i][0],x=dayItems(i),hours=laneHours(d+"-work")+laneHours(d+"-uni");
var h='<div class="page"><div class="today-head"><div><h2>'+["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][i]+", "+fmt(dayDate(i))+'</h2><div class="sub2">'+(x.total?x.done+" of "+x.total+" done":"Nothing planned yet")+(hours?" · "+hrs(hours)+" planned":"")+(function(){var tot=x.ids.reduce(function(a,id){return a+spentOf(id);},0);return tot>=60000?" · "+fmtDur(tot)+" tracked":"";})()+'</div></div><button data-view="board">Open board</button></div>';
if(x.rec.length)h+='<div class="panel tsec" style="margin-bottom:14px"><h3>Routine</h3>'+routineStrip(i)+"</div>";
h+='<div class="tgrid">';
["work","uni"].forEach(function(t){var k=d+"-"+t,ids=state.lists[k].filter(function(id){return state.tasks[id];}),n=ids.length,m=state.limits[t];
h+='<div class="tsec"><h3>'+(t==="work"?"Work":"Uni")+" · "+n+" / "+m+'</h3><div class="tlist">'+(ids.length?ids.map(tcardHTML).join(""):'<div class="panel empty">No '+(t==="work"?"work":"uni")+" tasks today. Pick some below.</div>")+"</div></div>";});
h+="</div>";
var pool=state.lists.pool.filter(function(id){return state.tasks[id]&&!state.tasks[id].done;});
h+='<div class="panel" style="margin-top:14px"><div class="ph"><h2>Pick for today <span class="count">'+pool.length+'</span></h2><button class="plain" id="picktoggle" style="color:var(--accent)">'+(pickOpen?"Hide":"Show")+"</button></div>";
if(pickOpen)h+=pool.length?pool.map(function(id){var t=state.tasks[id];return'<div class="pick" style="--c:'+esc(t.color)+'"><span class="dot"></span><span class="name">'+esc(t.name)+'</span><button class="small" data-pick="'+id+'|work">Work</button><button class="small" data-pick="'+id+'|uni">Uni</button></div>';}).join(""):'<div class="empty">Everything is scheduled.</div>';
return h+"</div></div>";}

function overviewHTML(){
var s=stats(),st=streak();
var rows=function(ids,w){if(!ids.length)return'<div class="empty">Nothing here</div>';return ids.map(function(id){var t=state.tasks[id];return'<div class="row'+(t.done?" done":"")+'" style="--c:'+esc(t.color)+'"><button class="check" data-check="'+id+'" aria-label="Mark done">'+CHECK+'</button><span class="name" data-edit="'+id+'">'+esc(t.name)+"</span>"+(w?'<span class="where">'+where(findList(id))+(spentOf(id)>=60000?" · "+fmtDur(spentOf(id)):"")+"</span>":"")+"</div>";}).join("");};
var open=[],done=[];
DAYS.forEach(function(d){["work","uni"].forEach(function(t){state.lists[d[0]+"-"+t].forEach(function(id){if(!state.tasks[id])return;(state.tasks[id].done?done:open).push(id);});});});
state.lists.pool.forEach(function(id){if(state.tasks[id]&&state.tasks[id].done)done.push(id);});
var pool=state.lists.pool.filter(function(id){return state.tasks[id]&&!state.tasks[id].done;});
var pct=s.total?Math.round(s.done/s.total*100):0;
var h='<div class="page"><div class="stats"><div class="stat"><div class="v">'+pct+'%</div><div class="l">Week done</div></div><div class="stat"><div class="v">'+st+'</div><div class="l">Day streak (all done)</div></div><div class="stat"><div class="v">'+open.length+'</div><div class="l">Scheduled, still open</div></div><div class="stat"><div class="v">'+pool.length+'</div><div class="l">Not scheduled yet</div></div></div>';
var hist=state.history.slice(-7).concat([{week:ymd(monday()),pct:pct,cur:true}]);
h+='<div class="panel" style="margin-bottom:14px"><div class="ph"><h2>Weekly score</h2><span class="count">% done per week</span></div><div class="hist">'+hist.map(function(w){var d=parseYmd(w.week);return'<div class="col"><small>'+w.pct+'%</small><div class="colbar'+(w.cur?" cur":"")+'" style="height:'+Math.max(2,w.pct)+'%"></div><small>'+(w.cur?"Now":fmt(d))+"</small></div>";}).join("")+"</div></div>";
h+='<div class="cols"><div class="panel"><div class="ph"><h2>Not scheduled</h2><span class="count">'+pool.length+'</span></div><div class="list">'+rows(pool,false)+'</div></div><div class="panel"><div class="ph"><h2>Scheduled, open</h2><span class="count">'+open.length+'</span></div><div class="list">'+rows(open,true)+'</div></div><div class="panel"><div class="ph"><h2>Done</h2><span class="count">'+done.length+'</span></div><div class="list">'+rows(done,true)+"</div></div></div></div>";
return h;}

function uniHTML(){
var openUe=0,openVl=0;state.subjects.forEach(function(s){s.ctr.forEach(function(c){var o=Math.max(0,c.released-c.done);if(c.label==="Übungen")openUe+=o;if(c.label==="Vorlesungen")openVl+=o;});});
var ex=examList()[0];
var h='<div class="page"><div class="usum"><div class="stat"><div class="v">'+openUe+'</div><div class="l">Übungen open (released, not done)</div></div><div class="stat"><div class="v">'+openVl+'</div><div class="l">Vorlesungen to review</div></div><div class="stat"><div class="v">'+(ex?daysUntil(ex.exam)+" d":"–")+'</div><div class="l">'+(ex?"Next Klausur: "+esc(ex.name)+" ("+fmt(parseYmd(ex.exam))+")":"No Klausur dates set")+'</div></div></div><div class="ugrid">';
state.subjects.forEach(function(s){
var n=s.exam?daysUntil(s.exam):null;
h+='<div class="subj" style="--c:'+esc(s.color)+'"><h3>'+esc(s.name)+(s.attempt>1?'<span class="tag">'+(s.attempt===2?"2nd":"3rd")+" attempt</span>":'<span class="tag first">1st attempt</span>')+'</h3><div class="exline">'+(s.exam?(n>=0?"Klausur in <b>"+n+" days</b> · "+fmtDay(s.exam):"Klausur was "+fmtDay(s.exam)):"Klausur date open")+"</div>";
s.ctr.forEach(function(c,ci){var pct=c.released?Math.round(c.done/c.released*100):0;
h+='<div class="ctr"><div class="ctrtop"><span>'+esc(c.label)+"</span><span><b>"+c.done+" / "+c.released+"</b> done"+(c.total?" · "+c.total+" total":"")+'</span></div><div class="pbar"><i style="width:'+pct+'%"></i></div><div class="ctrbtns"><button class="small" data-ctr="'+s.id+"|"+ci+'|minus">− done</button><button class="small" data-ctr="'+s.id+"|"+ci+'|plus">+ done</button><button class="small" data-ctr="'+s.id+"|"+ci+'|rel">+1 released</button>'+(c.label==="Übungen"&&c.released>c.done?'<button class="small primary" data-gen="'+s.id+"|"+ci+'">Create tasks for open Übungen</button>':"")+"</div></div>";});
h+=(s.note?'<div class="note">'+esc(s.note)+"</div>":"")+'<div class="ctrbtns"><button class="small" data-subj="'+s.id+'">Edit</button></div></div>';});
return h+'</div><div style="margin-top:12px"><button data-addsubj="1">+ Add subject</button></div></div>';}

function render(){var root=document.getElementById("root");var name=document.getElementById("newname"),keep=name?name.value:"",focused=name&&document.activeElement===name;
var body=view==="board"?boardHTML():view==="overview"?overviewHTML():view==="uni"?uniHTML():todayHTML();
root.innerHTML=headerHTML()+body;popId=null;
var n2=document.getElementById("newname");if(n2){n2.value=keep;if(focused)n2.focus();}
if(view==="board"){var td=document.querySelector(".day.today"),wk=document.querySelector(".week");if(td&&wk&&!render.scrolled&&window.innerWidth<=900){wk.scrollLeft=td.offsetLeft-wk.offsetLeft;render.scrolled=true;}}}
function persistRaw(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function persist(){state.savedAt=Date.now();persistRaw();if(typeof schedulePush==="function")schedulePush();}
function save(){updateLog();persist();render();}
var undoSnap=null,toastTimer=null;
function snapshot(){undoSnap=JSON.stringify(state);}
function toast(msg,canUndo){var old=document.querySelector(".toast");if(old)old.remove();clearTimeout(toastTimer);
var t=document.createElement("div");t.className="toast";t.innerHTML="<span>"+esc(msg)+"</span>"+(canUndo?'<button id="undo">Undo</button>':"");document.body.appendChild(t);
toastTimer=setTimeout(function(){t.remove();},canUndo?5000:2400);}

// ---------- sounds ----------
var actx=null;
function ac(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==="suspended")actx.resume();}catch(e){return null;}return actx;}
function tone(f,at,dur,type,vol){var c=ac();if(!c)return;var t0=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.02);}
function soundOn(){return state.sound!==false;}
function playAdd(){if(!soundOn())return;tone(660,0,0.1,"sine",0.14);tone(990,0.07,0.14,"sine",0.11);}
function playDone(){if(!soundOn())return;tone(784,0,0.16,"triangle",0.16);tone(1047,0.09,0.18,"triangle",0.14);tone(1319,0.18,0.32,"triangle",0.12);}
function playTick(){if(!soundOn())return;tone(880,0,0.07,"triangle",0.1);}
function playDrop(){if(!soundOn())return;tone(520,0,0.06,"sine",0.08);}

var cols=["#3b82f6","#22c55e","#a855f7","#f59e0b","#ef4444","#14b8a6","#ec4899"],P=[];for(var i=0;i<160;i++)P.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*0.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*0.4,c:cols[i%cols.length]});
var t0=performance.now();(function f(now){var el=now-t0;x.clearRect(0,0,innerWidth,innerHeight);P.forEach(function(p){p.vy+=0.32;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/2600);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);x.restore();});if(el<2600)requestAnimationFrame(f);else cv.remove();})(t0);}

if(t.subj){var s=state.subjects.filter(function(x){return x.id===t.subj;})[0];var c=s&&s.ctr[t.ctr||0];if(c)c.done=t.done?Math.min(c.released,c.done+1):Math.max(0,c.done-1);}
if(t.done){popId=id;playDone();}save();if(t.done)checkConfetti();}
function placeTask(id,to){if(to!=="pool"){var typ=to.split("-")[1];if(state.lists[to].length>=state.limits[typ]&&findList(id)!==to){playDeny();toast("Max "+state.limits[typ]+" "+typ+" tasks on that day");return false;}}
var from=findList(id);if(from)state.lists[from].splice(state.lists[from].indexOf(id),1);state.lists[to].push(id);return true;}

function startFocus(id){var t=state.tasks[id];if(!t)return;ac();state.timer={tid:id,name:t.name,phase:"focus",endsAt:Date.now()+state.focusMin*60000,paused:null};if(!(state.tracking&&state.tracking.tid===id)){stopTracking();state.tracking={tid:id,start:Date.now()};}persist();playAdd();renderPill();toast("Focus "+state.focusMin+" min started");}
function mmss(ms){ms=Math.max(0,ms);var s=Math.round(ms/1000),m=Math.floor(s/60);return pad(m)+":"+pad(s%60);}
function renderPill(){var T=state.timer,R=state.tracking,p=document.getElementById("pill");
if(!T&&!R){if(p)p.remove();return;}
if(!p){p=document.createElement("div");p.id="pill";document.body.appendChild(p);}
var h="";
if(T){var rem=T.paused!=null?T.paused:T.endsAt-Date.now();h+='<div class="prow"><div style="flex:1;min-width:0"><div class="ph2 '+T.phase+'">'+(T.phase==="focus"?"Focus":"Break")+(T.paused!=null?" · paused":"")+'</div><div class="tn">'+esc(T.name)+'</div></div><div class="tm">'+mmss(rem)+'</div><button class="small" id="tpause">'+(T.paused!=null?"Resume":"Pause")+'</button><button class="small" id="tstop">Stop</button></div>';}
if(R&&state.tasks[R.tid]){h+='<div class="prow"><div style="flex:1;min-width:0"><div class="ph2" style="color:var(--danger)">⏱ Tracking</div><div class="tn">'+esc(state.tasks[R.tid].name)+'</div></div><div class="tm">'+clock(spentOf(R.tid))+'</div><button class="small" id="trstop">Stop</button></div>';}
p.innerHTML=h;}
function tick(){document.querySelectorAll("[data-spent]").forEach(function(x){x.textContent="⏱ "+fmtDur(spentOf(x.getAttribute("data-spent")));});var T=state.timer;if(!T){renderPill();return;}if(T.paused==null&&T.endsAt-Date.now()<=0){
if(T.phase==="focus"){playBell();T.phase="break";T.endsAt=Date.now()+state.breakMin*60000;toast("Focus done. Break for "+state.breakMin+" min.");}
else{playBell();state.timer=null;toast("Break over. Next task.");}persist();}renderPill();}

// ---------- drag and drop ----------
var drag=null;
function allowed(id,to){if(to==="pool")return true;var from=findList(id);if(from===to)return true;var t=to.split("-")[1];return state.lists[to].length<state.limits[t];}
function beginDrag(x,y){var d=drag;if(!d||d.started)return;d.started=true;
var r=d.card.getBoundingClientRect();var g=d.card.cloneNode(true);g.classList.add("ghost");g.classList.remove("pop","press");g.style.width=r.width+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";document.body.appendChild(g);d.ghost=g;d.dx=d.x-r.left;d.dy=d.y-r.top;d.card.classList.add("dragging");moveDrag(x,y);}
function moveDrag(x,y){var d=drag;if(!d||!d.started)return;d.lx=x;d.ly=y;
d.ghost.style.left=(x-d.dx)+"px";d.ghost.style.top=(y-d.dy)+"px";
var el=document.elementFromPoint(x,y);var lane=el&&el.closest(".lane");
if(d.lane&&d.lane!==lane)d.lane.classList.remove("over","deny");d.lane=lane;
if(lane){var ok=allowed(d.id,lane.getAttribute("data-list"));lane.classList.toggle("over",ok);lane.classList.toggle("deny",!ok);}
var wk=document.querySelector(".week");if(wk){var wr=wk.getBoundingClientRect();if(y>wr.top&&y<wr.bottom){if(x>wr.right-40)wk.scrollLeft+=14;else if(x<wr.left+40)wk.scrollLeft-=14;}}
if(y<70)window.scrollBy(0,-12);else if(y>window.innerHeight-60)window.scrollBy(0,12);}
function finishDrag(cancel){var d=drag;drag=null;if(!d)return;clearTimeout(d.timer);if(!d.started)return;
justDragged=true;setTimeout(function(){justDragged=false;},120);
d.ghost.remove();d.card.classList.remove("dragging");if(d.lane)d.lane.classList.remove("over","deny");
if(cancel||!d.lane)return;
var to=d.lane.getAttribute("data-list");
if(!allowed(d.id,to)){var t=to.split("-")[1];playDeny();toast("Max "+state.limits[t]+" "+t+" tasks on that day");return;}
var cards=[].slice.call(d.lane.querySelectorAll(".card:not(.dragging)"));
var idx=cards.findIndex(function(c){var r=c.getBoundingClientRect();return d.ly<r.top+r.height/2;});
var beforeId=idx>-1?cards[idx].getAttribute("data-id"):null;
var from=findList(d.id);state.lists[from].splice(state.lists[from].indexOf(d.id),1);
var pos=beforeId?state.lists[to].indexOf(beforeId):-1;if(pos<0)pos=state.lists[to].length;
state.lists[to].splice(pos,0,d.id);popId=d.id;playDrop();save();}
document.addEventListener("pointerdown",function(e){if(e.pointerType==="touch"||e.button)return;
var card=e.target.closest(".card");if(!card||e.target.closest(".check"))return;
drag={id:card.getAttribute("data-id"),card:card,x:e.clientX,y:e.clientY,started:false,lane:null,pid:e.pointerId};});
document.addEventListener("pointermove",function(e){if(!drag||drag.touch||e.pointerId!==drag.pid)return;
if(!drag.started){if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;beginDrag(e.clientX,e.clientY);}
e.preventDefault();moveDrag(e.clientX,e.clientY);},{passive:false});
document.addEventListener("pointerup",function(e){if(drag&&!drag.touch&&e.pointerId===drag.pid){moveDrag(e.clientX,e.clientY);finishDrag(false);}});
document.addEventListener("pointercancel",function(e){if(drag&&!drag.touch&&e.pointerId===drag.pid)finishDrag(true);});
document.addEventListener("touchstart",function(e){if(e.touches.length!==1)return;
var card=e.target.closest(".card");if(!card||e.target.closest(".check"))return;
var t=e.touches[0];ac();
drag={touch:true,id:card.getAttribute("data-id"),card:card,x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,started:false,lane:null};
if(e.target.closest(".grip")){e.preventDefault();beginDrag(t.clientX,t.clientY);}
else{card.classList.add("press");drag.timer=setTimeout(function(){if(drag&&drag.touch&&!drag.started){card.classList.remove("press");beginDrag(drag.lx,drag.ly);}},300);}
},{passive:false});
document.addEventListener("touchmove",function(e){if(!drag||!drag.touch)return;var t=e.touches[0];
if(!drag.started){drag.lx=t.clientX;drag.ly=t.clientY;if(Math.abs(t.clientX-drag.x)+Math.abs(t.clientY-drag.y)>10){clearTimeout(drag.timer);drag.card.classList.remove("press");drag=null;}return;}
e.preventDefault();moveDrag(t.clientX,t.clientY);},{passive:false});
document.addEventListener("touchend",function(e){if(!drag||!drag.touch)return;drag.card.classList.remove("press");if(drag.started){e.preventDefault();finishDrag(false);}else{clearTimeout(drag.timer);drag=null;}},{passive:false});
document.addEventListener("touchcancel",function(){if(drag&&drag.touch){drag.card.classList.remove("press");finishDrag(true);}});

// ---------- sync via a private GitHub Gist ----------
var SK="week-planner-sync",FILE="week-planner.json",pushTimer=null,syncState="idle",pulling=false;
function syncCfg(){try{return JSON.parse(localStorage.getItem(SK)||"{}");}catch(e){return{};}}
function setSyncCfg(c){try{localStorage.setItem(SK,JSON.stringify(c));}catch(e){}}
function syncLabel(){return{idle:"☁ Synced",push:"☁ Syncing…",off:"☁ Offline, will sync",err:"☁ Sync problem"}[syncState]||"";}
function setSync(st){syncState=st;var el=document.getElementById("syncst");if(el)el.textContent=syncLabel();}
function gh(path,opt){var c=syncCfg();opt=opt||{};opt.headers={"Authorization":"token "+c.token,"Accept":"application/vnd.github+json"};if(opt.body)opt.headers["Content-Type"]="application/json";opt.cache="no-store";
return fetch("https://api.github.com"+path,opt).then(function(r){if(!r.ok){var e=new Error("http "+r.status);e.status=r.status;throw e;}return r.json();});}
function readGist(g){var f=g.files&&g.files[FILE];if(!f)return Promise.resolve(null);
if(f.truncated&&f.raw_url)return fetch(f.raw_url,{cache:"no-store"}).then(function(r){return r.json();});
try{return Promise.resolve(JSON.parse(f.content));}catch(e){return Promise.resolve(null);}}
function fileObj(){var o={};o[FILE]={content:JSON.stringify(state)};return o;}
function schedulePush(){var c=syncCfg();if(!c.token||!c.gist||pulling)return;clearTimeout(pushTimer);setSync("push");pushTimer=setTimeout(pushNow,1200);}
function pushNow(){pushTimer=null;var c=syncCfg();if(!c.token||!c.gist)return;
gh("/gists/"+c.gist,{method:"PATCH",body:JSON.stringify({files:fileObj()})}).then(function(){setSync("idle");}).catch(function(){setSync(navigator.onLine===false?"off":"err");});}
function pull(){var c=syncCfg();if(!c.token||!c.gist||pushTimer)return Promise.resolve();
return gh("/gists/"+c.gist).then(readGist).then(function(remote){
if(pushTimer)return;
if(remote&&remote.tasks&&(remote.savedAt||0)>(state.savedAt||0)){pulling=true;state=remote;ensure();persistRaw();pulling=false;render();renderPill();}
setSync("idle");}).catch(function(){setSync(navigator.onLine===false?"off":"err");});}
function connect(token,choice,m){var c={token:token};setSyncCfg(c);
var st=m.querySelector("#syncmsg");st.textContent="Connecting…";
gh("/gists?per_page=100").then(function(list){var g=list.filter(function(x){return x.files&&x.files[FILE];})[0];
if(!g){return gh("/gists",{method:"POST",body:JSON.stringify({description:"Week Planner sync",public:false,files:fileObj()})}).then(function(ng){c.gist=ng.id;setSyncCfg(c);return"created";});}
c.gist=g.id;setSyncCfg(c);
return gh("/gists/"+g.id).then(readGist).then(function(remote){
if(choice==="cloud"&&remote&&remote.tasks){pulling=true;state=remote;ensure();persistRaw();pulling=false;return"pulled";}
state.savedAt=Date.now();persistRaw();
return gh("/gists/"+g.id,{method:"PATCH",body:JSON.stringify({files:fileObj()})}).then(function(){return"pushed";});});})
.then(function(r){setSync("idle");m.remove();render();renderPill();toast(r==="pulled"?"Synced: loaded your data from the cloud":r==="created"?"Sync is on. This device is now the source.":"Synced: this device's data is now in the cloud");})
.catch(function(e){setSyncCfg({});st.textContent=e.status===401?"That token doesn't work. Check that you copied all of it and ticked “gist”.":"Couldn't connect. Check your internet and try again.";});}
function syncDlg(){var c=syncCfg();
if(c.token&&c.gist){dialog('<h3>Sync is on</h3><p>This device syncs automatically with your other devices through a private Gist on your GitHub.</p><p>Status: '+syncLabel()+'</p><div class="btns"><button class="danger left" data-d="off">Turn off here</button><button data-d="now">Sync now</button><button class="primary" data-d="close">Done</button></div>',function(m){
m.addEventListener("click",function(e){var d=e.target.getAttribute("data-d");if(d==="close")m.remove();if(d==="now"){pull().then(function(){if(syncState==="idle")toast("Up to date");});}if(d==="off"){setSyncCfg({});m.remove();render();toast("Sync turned off on this device");}});});return;}
dialog('<h3>Sync between devices</h3><p>Paste your GitHub token (it starts with ghp_). Use the same token on every device.</p><input type="text" id="tok" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false"><p><b>Device that has your tasks:</b> Upload this device.<br><b>Every other device:</b> Use cloud data.</p><p id="syncmsg" style="color:var(--danger)"></p><div class="btns"><button data-d="cancel" class="left">Cancel</button><button data-d="up">Upload this device</button><button class="primary" data-d="cloud">Use cloud data</button></div>',function(m){
m.addEventListener("click",function(e){var d=e.target.getAttribute("data-d");if(d==="cancel"){m.remove();return;}
if(d==="up"||d==="cloud"){var t=m.querySelector("#tok").value.trim();if(!t){m.querySelector("#syncmsg").textContent="Paste the token first.";return;}connect(t,d,m);}});});}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pull();else if(pushTimer){clearTimeout(pushTimer);pushNow();}});
window.addEventListener("online",function(){var c=syncCfg();if(c.gist)pushNow();});
setInterval(function(){if(document.visibilityState==="visible")pull();},45000);

render();renderPill();pull();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
